# One command for judges:  docker compose up --build
#   dashboard -> http://localhost:8501     API (Swagger) -> http://localhost:8000/docs
services:
  dashboard:
    build: .
    image: glucotwin:latest
    ports:
      - "8501:8501"
  api:
    image: glucotwin:latest
    depends_on:
      - dashboard
    command: ["uvicorn", "glucotwin.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
